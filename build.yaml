targets:
  $default:
    builders:
      go_router_builder:
        generate_for:
          - lib/router/router.dart
      drift_dev:
        generate_for:
          - lib/database/database.dart
      json_serializable:
        options:
          # Surface a retyped API field as CheckedFromJsonException (an
          # Exception) instead of TypeError (an Error), so the boundary can
          # classify it as a retrieval failure.
          checked: true
